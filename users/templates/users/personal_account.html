<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="stylesheet" href="{% static 'vendor/css/account.css' %}">
</head>
<body>
<h1>Личный кабинет</h1>
<form action="{% url 'account' %}" method="post"  enctype="multipart/form-data">
    {% csrf_token %}
    <div class="container">
        <div class="col-md-6">
            <label class="small mb-1" for="{{ form.profile_picture.id_for_label }}">Изображение профиля</label>
             {% if form.instance.profile_picture %}
                <img src="{{ form.instance.profile_picture.url }}" alt="Profile Picture" class="profile-picture">

            {% endif %}
            {{ form.profile_picture }}
        </div>
        <div class="form-group">
            <label class="small mb-1" for="{{ form.username.id_for_label }}">Имя пользователя</label>
            {{ form.username }}
        </div>
        <div class="col-md-6">
            <label class="small mb-1" for="{{ form.email.id_for_label }}">Адрес электронной почты</label>
            {{ form.email }}
        </div>
    </div>
    <button type="submit">Сохранить</button>
   <a href="{% url 'orders' %}" class="button-bottom-left">История заказов</a>


</form>
<footer>
    <p>&copy; 2024 Магазин цветов 'Lavender'. Все права защищены.</p>
</footer>
</body>
</html>
